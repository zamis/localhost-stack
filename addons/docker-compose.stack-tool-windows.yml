name: stack-tool-windows

networks:
  my-network-proxy:
    external: true

volumes:
  windows-tool-store:

services:
  windows-dev:
    restart: none
    image: dockurr/windows
    environment:
      VERSION: "core11"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      - my-network-proxy
    expose:
      - 8006
    ports:
      - 8006:8006
    volumes:
      - windows-tool-store:/storage:rw
    labels:
      virtual.caddyfile: |
        http://windows-dev.localhost {
          reverse_proxy windows-dev:8006 {
          }
        }
      virtual.homefile: |
        <div>
          <a class="shadow" href="http://windows-dev.localhost">windows-dev</a>
          <small>http://windows-dev.localhost</small>
        </div>
